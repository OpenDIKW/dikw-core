# Adapted from OpenSDLC managed-agent-platform (Apache-2.0), with OpenDIKW rollout configuration.
name: Issue triage

on:
  issues:
    types:
      - opened
      - closed
      - reopened
      - edited
      - labeled
      - unlabeled
      - typed
      - untyped
      - transferred
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.action != 'transferred' || github.event.changes.new_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply the issue type and labels
        env:
          ISSUE_TRIAGE_ROLLOUT: ${{ vars.ISSUE_TRIAGE_ROLLOUT }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.changes.new_issue.number || github.event.issue.number }}
        run: python3 .github/scripts/issue_labels.py
