# Adapted OpenSDLC managed-agent-platform triage fields (Apache-2.0) for OpenDIKW.
name: Feature request
description: Suggest an idea or improvement for dikw-core
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! dikw-core is in alpha, so the design is still
        moving — for larger changes, please open this issue to discuss before
        sending a big PR.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Choose p0 for critical, urgent work, p1 for important work, or p2 for work that can wait.
      options:
        - p0
        - p1
        - p2
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Choose easy if AI can proceed directly, medium if AI must write a plan first, or hard if a person must make a decision.
      options:
        - easy
        - medium
        - hard
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point, not just the solution.
      placeholder: "When I retrieve across a large base, I can't…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. CLI/API shape, config, behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art (e.g. Karpathy's LLM-Wiki, Open Knowledge Format), screenshots.
    validations:
      required: false
