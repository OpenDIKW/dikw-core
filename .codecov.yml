# Codecov config.
#
# Coverage uploads come from two jobs in ``.github/workflows/reusable-ci.yml``:
#   - ``lint-type-test (3.12)`` (flags: ``unit``)
#   - ``postgres-contract`` (flags: ``postgres`` — covers ``storage/postgres.py``
#     and ``server/tasks/store_postgres.py``; Codecov merges sessions by flag).
#
# The default ``patch.target = auto`` with ``threshold = 0`` means *any* dip —
# even 0.05 % — fails the patch check, punishing legitimate work where a few
# defensive branches don't get exercised. A 2 % threshold leaves room for
# defence-in-depth lines without giving a license to drop overall coverage.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 2%
